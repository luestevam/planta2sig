[project]
name = "geodoc-sig"
version = "1.0.0"
description = "Converte plantas analógicas (PDF, JPG, PNG) em camadas SIG: extração, revisão e exportação."
requires-python = ">=3.10"
# Mantenha esta lista igual ao requirements.txt: o Vercel instala a partir do pyproject.toml.
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20",
  "pymupdf>=1.26,<2",
  "shapely>=2.1,<3",
  "pyproj>=3.7,<4",
  "pyshp>=3,<4",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "opencv-python-headless>=4.10,<6",
  "httpx>=0.28,<1",
  "scikit-image>=0.24,<1",
  "scipy>=1.13,<2",
]

[tool.vercel]
entrypoint = "backend.main:app"
